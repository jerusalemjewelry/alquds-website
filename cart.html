<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Shopping Cart - Alquds Jewelry</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="header-main">
        <div class="container flex justify-between items-center">
            <div class="logo">
                <a href="/" class="text-gold"
                    style="font-family: var(--font-heading); font-size: 1.8rem;">ALQUDS <span
                        class="text-white">JEWELRY</span></a>
            </div>
            <div class="header-actions">
                <a href="/cart.html" class="text-white relative">
                    <i class="fa-solid fa-shopping-bag"></i>
                    <span id="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <div class="container" style="padding: 60px 20px; max-width: 800px;">
        <h1 class="mb-5">Your Bag</h1>

        <div id="cart-items">
            <!-- JS Populated -->
        </div>

        <div id="cart-total" class="flex justify-between items-center"
            style="border-top: 1px solid #333; padding-top: 20px; margin-top: 30px; font-size: 1.5rem;">
            <span class="text-muted">Total</span>
            <span class="text-gold" id="total-price">$0.00</span>
        </div>

        <div class="mt-5 text-center">
            <a href="/checkout.html" class="btn btn-primary" style="width: 100%; padding: 20px; display: block; text-align: center; text-decoration: none;">PROCEED TO CHECKOUT</a>
            <a href="catalog.html" class="block mt-4 text-muted text-sm">Continue Shopping</a>
        </div>
    </div>

    <script src="js/app-v3.js?v=5"></script>
    <script>
        window.renderCart = function() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('total-price');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 0; color: #888;">
                        <i class="fa-solid fa-shopping-bag mb-3" style="font-size: 3rem; color: #333;"></i>
                        <p>Your bag is empty.</p>
                    </div>
                `;
                totalEl.innerText = '$0.00';
            } else {
                let total = 0;
                container.innerHTML = cart.map(item => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    
                    let metaDetails = `${item.karat}k`;
                    if (item.metal === 'Silver') metaDetails = 'Silver';
                    if (item.weight && item.weight !== 'Varies' && item.weight !== 'N/A') {
                        metaDetails += ` • ${item.weight}g`;
                    }

                    return `
                        <div class="flex items-center gap-4 mb-4" style="background: #1a1a1a; padding: 20px; border-radius: 4px; border: 1px solid #333;">
                            <img src="${item.image}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 4px; border: 1px solid #000;">
                            <div style="flex: 1;">
                                <a href="/product/${item.id}/" style="text-decoration: none;">
                                    <h4 class="text-white hover:text-gold transition-colors">${item.name}</h4>
                                </a>
                                <div class="text-muted" style="font-size: 0.9rem; margin-top: 5px;">${metaDetails}</div>
                                <button onclick="removeDrawerItem('${item.id}')" style="background: none; border: none; color: #ff4444; padding: 0; margin-top: 10px; cursor: pointer; font-size: 0.85rem;">Remove</button>
                            </div>
                            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 15px;">
                                <div class="text-gold" style="font-size: 1.2rem; font-weight: bold;">$${itemTotal.toLocaleString()}</div>
                                <div style="display: flex; align-items: center; border: 1px solid #333; border-radius: 4px; background: #000;">
                                    <button onclick="updateDrawerQty('${item.id}', -1)" style="background: none; border: none; color: #aaa; width: 30px; height: 30px; cursor: pointer;">-</button>
                                    <span style="color: white; width: 30px; text-align: center; font-size: 0.9rem;">${item.quantity}</span>
                                    <button onclick="updateDrawerQty('${item.id}', 1)" style="background: none; border: none; color: #aaa; width: 30px; height: 30px; cursor: pointer;">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                totalEl.innerText = '$' + total.toLocaleString();
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
        });
    </script>
</body>

</html>
